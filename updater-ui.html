<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Studio - Update Available</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: #0f0f13;
      color: #f1f1f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      border: 1px solid #272733;
      border-radius: 12px;
    }
    .titlebar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #14141a;
      border-bottom: 1px solid #22222d;
      -webkit-app-region: drag;
    }
    .titlebar-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: #a0a0b2;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .titlebar-close {
      -webkit-app-region: no-drag;
      background: transparent;
      border: none;
      color: #888899;
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.15s ease;
    }
    .titlebar-close:hover {
      background: #e81123;
      color: #ffffff;
    }
    .content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .header {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }
    .icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
      flex-shrink: 0;
    }
    .icon-box svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .header-text h1 {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .badges {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .badge-old {
      background: #23232f;
      color: #9999aa;
    }
    .badge-new {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
    }
    .badge-size {
      color: #717188;
    }
    .changelog-box {
      background: #15151c;
      border: 1px solid #232330;
      border-radius: 10px;
      padding: 14px 16px;
      max-height: 160px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      color: #c0c0d0;
      user-select: text;
    }
    .changelog-box h2, .changelog-box h3 {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      margin: 8px 0 4px;
    }
    .changelog-box h2:first-child, .changelog-box h3:first-child {
      margin-top: 0;
    }
    .changelog-box ul {
      margin-left: 18px;
      margin-bottom: 6px;
    }
    .changelog-box li {
      margin-bottom: 3px;
    }
    .progress-container {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: #15151c;
      border: 1px solid #232330;
      border-radius: 10px;
      padding: 14px;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: #a0a0b5;
    }
    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #252533;
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      border-radius: 4px;
      transition: width 0.2s ease;
    }
    .footer {
      padding: 16px 24px;
      background: #14141a;
      border-top: 1px solid #22222d;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-secondary {
      background: #22222e;
      color: #cccccc;
      border: 1px solid #2e2e3d;
    }
    .btn-secondary:hover {
      background: #2a2a3a;
      color: #ffffff;
    }
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      box-shadow: 0 6px 18px rgba(59, 130, 246, 0.45);
      transform: translateY(-1px);
    }
    .btn-success {
      background: linear-gradient(135deg, #10b981, #059669);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
    }
    .btn-success:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none !important;
    }
    /* Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #2c2c3d;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3e3e55;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Video Studio Update
    </div>
    <button class="titlebar-close" id="closeBtn" title="Close">&times;</button>
  </div>

  <div class="content">
    <div class="header">
      <div class="icon-box" id="iconBox">
        <svg viewBox="0 0 24 24"><path d="M12 2v10m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
      </div>
      <div class="header-text">
        <h1 id="titleText">New Version Available!</h1>
        <div class="badges">
          <span class="badge badge-old" id="currentVerBadge">Current: v1.0.0</span>
          <span>&rarr;</span>
          <span class="badge badge-new" id="newVerBadge">v1.0.1</span>
          <span class="badge-size" id="sizeBadge">(113 MB)</span>
        </div>
      </div>
    </div>

    <div class="changelog-box" id="changelogBox">
      <!-- Formatted release notes will be placed here -->
    </div>

    <div class="progress-container" id="progressContainer">
      <div class="progress-header">
        <span id="progressStatus">Downloading update...</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBarFill"></div>
      </div>
    </div>
  </div>

  <div class="footer">
    <button class="btn btn-secondary" id="githubBtn">View on GitHub</button>
    <button class="btn btn-secondary" id="laterBtn">Later</button>
    <button class="btn btn-primary" id="downloadBtn">⬇️ Download &amp; Update</button>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    let releaseData = null;
    let downloadedFilePath = null;

    // Elements
    const titleText = document.getElementById('titleText');
    const currentVerBadge = document.getElementById('currentVerBadge');
    const newVerBadge = document.getElementById('newVerBadge');
    const sizeBadge = document.getElementById('sizeBadge');
    const changelogBox = document.getElementById('changelogBox');
    const progressContainer = document.getElementById('progressContainer');
    const progressStatus = document.getElementById('progressStatus');
    const progressPercent = document.getElementById('progressPercent');
    const progressBarFill = document.getElementById('progressBarFill');
    const downloadBtn = document.getElementById('downloadBtn');
    const laterBtn = document.getElementById('laterBtn');
    const githubBtn = document.getElementById('githubBtn');
    const closeBtn = document.getElementById('closeBtn');

    // Simple markdown-to-html formatter for changelog
    function formatMarkdown(text) {
      if (!text) return '<p>Bug fixes and general performance improvements.</p>';
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h2>$1</h2>')
        .replace(/^\* (.*$)/gim, '<li>$1</li>')
        .replace(/^- (.*$)/gim, '<li>$1</li>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/(<li>.*<\/li>)/gms, '<ul>$1</ul>')
        .replace(/\n\n/g, '<br/>');
    }

    ipcRenderer.on('update-info', (event, data) => {
      releaseData = data;
      currentVerBadge.textContent = `Current: v${data.currentVersion}`;
      newVerBadge.textContent = `${data.latestVersion}`;
      sizeBadge.textContent = data.assetSize ? `(${data.assetSize})` : '';
      changelogBox.innerHTML = formatMarkdown(data.releaseNotes);
    });

    closeBtn.addEventListener('click', () => ipcRenderer.send('updater-close'));
    laterBtn.addEventListener('click', () => ipcRenderer.send('updater-close'));

    githubBtn.addEventListener('click', () => {
      if (releaseData?.releaseUrl) {
        ipcRenderer.send('updater-open-url', releaseData.releaseUrl);
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (downloadedFilePath) {
        // Already downloaded, launch it!
        ipcRenderer.send('updater-launch-file', downloadedFilePath);
        return;
      }
      // Start download
      downloadBtn.disabled = true;
      downloadBtn.textContent = 'Downloading...';
      laterBtn.disabled = true;
      progressContainer.style.display = 'flex';
      ipcRenderer.send('updater-start-download');
    });

    ipcRenderer.on('download-progress', (event, progress) => {
      const pct = Math.round(progress.percent || 0);
      progressBarFill.style.width = `${pct}%`;
      progressPercent.textContent = `${pct}%`;
      if (progress.transferred && progress.total) {
        progressStatus.textContent = `Downloading: ${progress.transferred} of ${progress.total}`;
      }
    });

    ipcRenderer.on('download-complete', (event, info) => {
      downloadedFilePath = info.filePath;
      progressStatus.textContent = '✅ Download complete! Saved to Downloads.';
      progressPercent.textContent = '100%';
      progressBarFill.style.width = '100%';
      
      downloadBtn.disabled = false;
      downloadBtn.className = 'btn btn-success';
      downloadBtn.textContent = '🚀 Launch New Version';

      laterBtn.disabled = false;
      laterBtn.textContent = '📁 Show in Folder';
      laterBtn.onclick = () => ipcRenderer.send('updater-show-in-folder', downloadedFilePath);
    });

    ipcRenderer.on('download-error', (event, errMessage) => {
      downloadBtn.disabled = false;
      downloadBtn.textContent = 'Retry Download';
      laterBtn.disabled = false;
      progressStatus.textContent = `Error: ${errMessage}`;
      progressStatus.style.color = '#ef4444';
    });
  </script>
</body>
</html>
