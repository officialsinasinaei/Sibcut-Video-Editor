<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lower Thirds & Broadcast Overlays</title>
  <link rel="stylesheet" href="style.css">
  <script src="../shared/extension-sdk.js"></script>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
        </div>
        <div>
          <h1 class="app-title">Lower Thirds</h1>
          <span class="app-subtitle">Broadcast Graphics</span>
        </div>
      </div>

      <div class="sidebar-scrollable">
        <section class="section">
          <h2 class="section-title">Speaker & Details</h2>
          <div class="field">
            <label for="speakerName">Speaker / Presenter Name</label>
            <input type="text" id="speakerName" class="input" value="ALEX MORGAN" maxlength="40">
          </div>
          <div class="field">
            <label for="speakerTitle">Title / Organization</label>
            <input type="text" id="speakerTitle" class="input" value="SENIOR LEAD ARCHITECT" maxlength="60">
          </div>
          <div class="field">
            <label for="socialHandle">Social / Tag (Optional)</label>
            <input type="text" id="socialHandle" class="input" value="@alexmorgan" maxlength="30">
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Overlay Theme</h2>
          <div class="style-cards">
            <button type="button" class="style-card active" data-style="broadcast">Modern Broadcast</button>
            <button type="button" class="style-card" data-style="minimal">Tech Minimalist</button>
            <button type="button" class="style-card" data-style="cyber">Cyber Edge</button>
          </div>
        </section>

        <section class="section">
          <h2 class="section-title">Colors & Animation</h2>
          <div class="field-row">
            <div class="field">
              <label for="accentColor">Accent Color</label>
              <input type="color" id="accentColor" value="#0ea5e9">
            </div>
            <div class="field">
              <label for="barColor">Bar Color</label>
              <input type="color" id="barColor" value="#1e293b">
            </div>
            <div class="field">
              <label for="duration">Duration (s)</label>
              <input type="range" id="duration" min="2" max="6" step="0.5" value="4">
              <span id="durationVal" class="range-val">4.0s</span>
            </div>
          </div>
        </section>

        <section class="section export-section">
          <button type="button" id="addToTimelineBtn" class="action-btn primary-action">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="6" rx="1.5"></rect>
              <rect x="3" y="14" width="9" height="6" rx="1.5"></rect>
              <path d="M18 14v6"></path>
              <path d="M15 17h6"></path>
            </svg>
            <span>Add to Timeline</span>
          </button>
          <div id="exportStatus" class="export-status" hidden>
            <div class="status-row">
              <span id="statusLabel">Rendering...</span>
              <span id="statusPct">0%</span>
            </div>
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <main class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="previewCanvas" width="1920" height="1080"></canvas>
      </div>

      <footer class="transport-bar">
        <div class="transport-left">
          <button type="button" id="playPauseBtn" class="transport-btn" aria-label="Play / Pause">
            <svg id="playIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="pauseIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
          <button type="button" id="restartBtn" class="transport-btn" aria-label="Restart">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 4v6h6"></path>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
          </button>
          <span id="timecode" class="timecode">00:00 / 04:00</span>
        </div>
        <div class="transport-center">
          <input type="range" id="scrubber" min="0" max="1" step="0.001" value="0" class="scrubber">
        </div>
        <div class="transport-right">
          <span class="resolution-badge">1920x1080 Transparent Overlay</span>
        </div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
