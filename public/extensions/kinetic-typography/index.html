<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Typography Generator</title>
  <link rel="stylesheet" href="style.css">
  <script src="../shared/extension-sdk.js"></script>
</head>
<body>
  <div class="app-container">
    <!-- Extension Sidebar Controls -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="4 7 4 4 20 4 20 7"></polyline>
            <line x1="9" y1="20" x2="15" y2="20"></line>
            <line x1="12" y1="4" x2="12" y2="20"></line>
          </svg>
        </div>
        <div>
          <h1 class="app-title">Kinetic Typography</h1>
          <span class="app-subtitle">Motion Title Generator</span>
        </div>
      </div>

      <div class="sidebar-scrollable">
        <!-- Text Content -->
        <section class="section">
          <h2 class="section-title">Text Content</h2>
          <div class="field">
            <label for="primaryText">Main Title</label>
            <input type="text" id="primaryText" class="input" value="CREATIVE STUDIO" maxlength="50">
          </div>
          <div class="field">
            <label for="secondaryText">Subtitle / Tagline</label>
            <input type="text" id="secondaryText" class="input" value="NEXT GENERATION EXTENSIONS" maxlength="80">
          </div>
        </section>

        <!-- Presets -->
        <section class="section">
          <h2 class="section-title">Design Presets</h2>
          <div class="preset-grid">
            <button type="button" class="preset-btn active" data-preset="neon">Neon Glow</button>
            <button type="button" class="preset-btn" data-preset="cinematic">Cinematic</button>
            <button type="button" class="preset-btn" data-preset="cyber">Cyberpunk</button>
            <button type="button" class="preset-btn" data-preset="minimal">Minimalist</button>
          </div>
        </section>

        <!-- Animation & Style -->
        <section class="section">
          <h2 class="section-title">Motion Style</h2>
          <div class="field">
            <label for="animStyle">Animation Style</label>
            <select id="animStyle" class="select">
              <option value="pop">Kinetic Pop & Drift</option>
              <option value="glitch">Glitch & Neon Pulse</option>
              <option value="slide">Smooth Split Slide</option>
              <option value="typewriter">Typewriter Reveal</option>
            </select>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="duration">Duration (sec)</label>
              <input type="range" id="duration" min="2" max="8" step="0.5" value="3.5">
              <span id="durationVal" class="range-val">3.5s</span>
            </div>
            <div class="field">
              <label for="fontSize">Text Scale</label>
              <input type="range" id="fontSize" min="36" max="96" step="2" value="64">
              <span id="fontSizeVal" class="range-val">64px</span>
            </div>
          </div>
        </section>

        <!-- Colors & Background -->
        <section class="section">
          <h2 class="section-title">Color Theme</h2>
          <div class="field-row">
            <div class="field">
              <label for="primaryColor">Text Color</label>
              <input type="color" id="primaryColor" value="#38bdf8">
            </div>
            <div class="field">
              <label for="accentColor">Accent Color</label>
              <input type="color" id="accentColor" value="#f43f5e">
            </div>
            <div class="field">
              <label for="bgStyle">Background</label>
              <select id="bgStyle" class="select">
                <option value="dark">Deep Space</option>
                <option value="gradient">Vibrant Gradient</option>
                <option value="black">Pure Black</option>
                <option value="transparent">Transparent / Chroma</option>
              </select>
            </div>
          </div>
        </section>

        <!-- Export & Add to Timeline Action -->
        <section class="section export-section">
          <button type="button" id="addToTimelineBtn" class="action-btn primary-action">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="6" rx="1.5"></rect>
              <rect x="3" y="14" width="9" height="6" rx="1.5"></rect>
              <path d="M18 14v6"></path>
              <path d="M15 17h6"></path>
            </svg>
            <span>Add to Timeline</span>
          </button>
          <div id="exportStatus" class="export-status" hidden>
            <div class="status-row">
              <span id="statusLabel">Rendering video...</span>
              <span id="statusPct">0%</span>
            </div>
            <div class="progress-bar">
              <div id="progressFill" class="progress-fill"></div>
            </div>
          </div>
        </section>
      </div>
    </aside>

    <!-- Main Live Workspace Preview -->
    <main class="preview-area">
      <div class="canvas-wrapper">
        <canvas id="previewCanvas" width="1920" height="1080"></canvas>
      </div>

      <!-- Playback Transport -->
      <footer class="transport-bar">
        <div class="transport-left">
          <button type="button" id="playPauseBtn" class="transport-btn" aria-label="Play / Pause">
            <svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <polygon points="5 3 19 12 5 21 5 3"></polygon>
            </svg>
            <svg id="pauseIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
              <rect x="6" y="4" width="4" height="16"></rect>
              <rect x="14" y="4" width="4" height="16"></rect>
            </svg>
          </button>
          <button type="button" id="restartBtn" class="transport-btn" aria-label="Restart">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 4v6h6"></path>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
          </button>
          <span id="timecode" class="timecode">00:00 / 03:30</span>
        </div>

        <div class="transport-center">
          <input type="range" id="scrubber" min="0" max="1" step="0.001" value="0" class="scrubber">
        </div>

        <div class="transport-right">
          <span class="resolution-badge">1080p 60fps</span>
        </div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
