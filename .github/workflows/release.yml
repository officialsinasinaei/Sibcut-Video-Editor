name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  validate-version:
    name: Validate Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Verify Tag Matches package.json Version
        run: |
          RAW_TAG="${{ github.ref_name }}"
          if [ -z "$RAW_TAG" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.tag }}"
          fi
          EXPECTED_VERSION="${RAW_TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Release tag: $RAW_TAG"
          echo "Expected version: $EXPECTED_VERSION"
          echo "package.json version: $PKG_VERSION"
          if [ "$EXPECTED_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($RAW_TAG) does not match package.json version ($PKG_VERSION)!"
            exit 1
          fi

  build-windows:
    name: Build Windows (Setup & Portable) & Smoke Test
    needs: validate-version
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Hydrate native speech engine binaries
        run: node tools/fetch-native-vosk.mjs

      - name: Verify licenses and packaging guardrails
        shell: pwsh
        run: |
          npm run check:licenses
          npm run check:packaging

      - name: Build Electron application
        run: npm run build:electron

      - name: Package Windows executables
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify Windows Package via Smoke Test
        shell: pwsh
        run: |
          npx electron . --smoke-test

      - name: Validate Windows release artifacts
        shell: pwsh
        run: |
          $expected = @(
            "release/Sibcut-Video-Editor-Setup.exe",
            "release/Sibcut-Video-Editor-Portable.exe"
          )
          foreach ($f in $expected) {
            if (-not (Test-Path $f)) {
              Write-Error "Required Windows artifact missing: $f"
              exit 1
            }
          }
          New-Item -ItemType Directory -Path "dist-release" -Force | Out-Null
          Copy-Item "release/Sibcut-Video-Editor-Setup.exe" -Destination "dist-release/"
          Copy-Item "release/Sibcut-Video-Editor-Portable.exe" -Destination "dist-release/"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: dist-release/*
          if-no-files-found: error

  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64) & Smoke Test
    needs: validate-version
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Hydrate native speech engine binaries
        run: node tools/fetch-native-vosk.mjs

      - name: Verify licenses and packaging
        run: |
          npm run check:licenses
          npm run check:packaging

      - name: Build Electron application
        run: npm run build:electron

      - name: Package macOS Apple Silicon application
        shell: bash
        run: |
          EXTRA_BUILDER_ARGS="-c.npmRebuild=false"
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No CSC_LINK certificate secret configured. Setting mac.identity=null to skip code signing."
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
            unset APPLE_ID
            unset APPLE_APP_SPECIFIC_PASSWORD
            unset APPLE_TEAM_ID
            EXTRA_BUILDER_ARGS="-c.mac.identity=null -c.npmRebuild=false"
          fi
          npx electron-builder --mac --arm64 --publish never $EXTRA_BUILDER_ARGS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS arm64 DMG via Headless Smoke Test
        run: |
          DMG_PATH=$(find release -maxdepth 1 -name "*arm64.dmg" | head -n 1)
          echo "Found DMG: $DMG_PATH"
          echo "Mounting disk image..."
          MOUNT_LINE=$(hdiutil attach "$DMG_PATH" -nobrowse | grep "/Volumes")
          MOUNT_DIR=$(echo "$MOUNT_LINE" | awk -F'\t' '{print $NF}' | tr -d '\r')
          echo "Mounted volume: $MOUNT_DIR"
          echo "Running Electron smoke test on mounted bundle..."
          "$MOUNT_DIR"/"Sibcut Video Editor.app"/Contents/MacOS/"Sibcut Video Editor" --smoke-test --no-sandbox
          echo "Smoke test passed successfully. Unmounting..."
          hdiutil detach "$MOUNT_DIR" -force

      - name: Stage macOS arm64 artifacts
        run: |
          mkdir -p dist-release
          find release -maxdepth 1 -type f \( -name "*arm64.dmg" -o -name "*arm64.zip" \) -exec cp {} dist-release/ \;

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-artifacts
          path: dist-release/*
          if-no-files-found: error

  build-macos-x64:
    name: Build macOS (Intel x64) & Integrity Check
    needs: validate-version
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies and x64 native addons
        run: |
          npm ci
          npm install --no-save --force @koromix/koffi-darwin-x64@3.3.4

      - name: Hydrate native speech engine binaries
        run: node tools/fetch-native-vosk.mjs

      - name: Verify licenses and packaging
        run: |
          npm run check:licenses
          npm run check:packaging

      - name: Build Electron application
        run: npm run build:electron

      - name: Package macOS Intel application
        shell: bash
        run: |
          EXTRA_BUILDER_ARGS="-c.npmRebuild=false"
          if [ -z "${CSC_LINK:-}" ]; then
            echo "No CSC_LINK certificate secret configured. Setting mac.identity=null to skip code signing."
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
            unset APPLE_ID
            unset APPLE_APP_SPECIFIC_PASSWORD
            unset APPLE_TEAM_ID
            EXTRA_BUILDER_ARGS="-c.mac.identity=null -c.npmRebuild=false"
          fi
          npx electron-builder --mac --x64 --publish never $EXTRA_BUILDER_ARGS
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS x64 Package Architecture & Integrity
        run: |
          DMG_PATH=$(find release -maxdepth 1 -name "*x64.dmg" | head -n 1)
          echo "Found Intel DMG: $DMG_PATH"
          echo "Mounting disk image..."
          MOUNT_LINE=$(hdiutil attach "$DMG_PATH" -nobrowse | grep "/Volumes")
          MOUNT_DIR=$(echo "$MOUNT_LINE" | awk -F'\t' '{print $NF}' | tr -d '\r')
          echo "Mounted volume: $MOUNT_DIR"
          echo "Verifying x86_64 Mach-O architecture..."
          file "$MOUNT_DIR"/"Sibcut Video Editor.app"/Contents/MacOS/"Sibcut Video Editor" | grep -E "x86_64"
          echo "Architecture verified. Unmounting..."
          hdiutil detach "$MOUNT_DIR" -force

      - name: Stage macOS x64 artifacts
        run: |
          mkdir -p dist-release
          find release -maxdepth 1 -type f \( -name "*x64.dmg" -o -name "*x64.zip" \) -exec cp {} dist-release/ \;

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-artifacts
          path: dist-release/*
          if-no-files-found: error

  build-linux:
    name: Build Linux (AppImage & DEB) & Smoke Test
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Linux build dependencies & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev xvfb
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install dependencies
        run: npm ci

      - name: Hydrate native speech engine binaries
        run: node tools/fetch-native-vosk.mjs

      - name: Verify licenses and packaging
        run: |
          npm run check:licenses
          npm run check:packaging

      - name: Build Electron application
        run: npm run build:electron

      - name: Package Linux applications
        run: npx electron-builder --linux --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify Linux AppImage via Headless Smoke Test
        run: |
          UNPACKED_BIN="release/linux-unpacked/Sibcut Video Editor"
          if [ -f "$UNPACKED_BIN" ]; then
            chmod +x "$UNPACKED_BIN"
            echo "Executing unpacked Linux binary: $UNPACKED_BIN"
            xvfb-run --auto-servernum "$UNPACKED_BIN" --smoke-test --no-sandbox
          fi
          APPIMAGE=$(find release -maxdepth 1 -name "*.AppImage" | head -n 1)
          if [ -n "$APPIMAGE" ]; then
            echo "Extracting AppImage for headless verification: $APPIMAGE"
            chmod +x "$APPIMAGE"
            WORKSPACE_DIR="$(pwd)"
            TMP_EXTRACT=$(mktemp -d)
            cd "$TMP_EXTRACT"
            "$WORKSPACE_DIR/$APPIMAGE" --appimage-extract
            echo "Executing extracted AppImage bundle..."
            xvfb-run --auto-servernum ./squashfs-root/"Sibcut Video Editor" --smoke-test --no-sandbox
            cd "$WORKSPACE_DIR"
            rm -rf "$TMP_EXTRACT"
          fi

      - name: Stage Linux artifacts
        run: |
          mkdir -p dist-release
          find release -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.deb" \) -exec cp {} dist-release/ \;

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: dist-release/*
          if-no-files-found: error

  publish:
    name: Aggregate Checksums & Publish GitHub Release
    needs: [build-windows, build-macos-arm64, build-macos-x64, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create release bundle directory
        run: mkdir -p release-bundle

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-bundle
          merge-multiple: true

      - name: Generate master SHA256SUMS.txt and verify
        run: |
          cd release-bundle
          rm -f *.sha256
          sha256sum * > SHA256SUMS.txt
          echo "=== Generated SHA256SUMS.txt ==="
          cat SHA256SUMS.txt
          echo "=== Verifying Checksums ==="
          sha256sum --check SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-bundle/*
          name: Sibcut Video Editor ${{ github.ref_name || github.event.inputs.tag || 'v1.0.0' }}
          tag_name: ${{ github.ref_name || github.event.inputs.tag || 'v1.0.0' }}
          body: |
            ## Sibcut Video Editor ${{ github.ref_name || github.event.inputs.tag || 'v1.0.0' }}

            A professional, multi-track, offline-first desktop video editor.

            ### Downloads

            | Platform | Architecture | Download File | Description |
            |---|---|---|---|
            | **Windows** | x64 | **`Sibcut-Video-Editor-Setup.exe`** | **Recommended installer** (Start menu, desktop shortcuts, uninstaller) |
            | **Windows** | x64 | `Sibcut-Video-Editor-Portable.exe` | Standalone portable (no installation, run anywhere/USB) |
            | **macOS** | Apple Silicon (`arm64`) | **`Sibcut-Video-Editor-macOS-arm64.dmg`** | **Recommended macOS download** (M1/M2/M3/M4 Macs) |
            | **macOS** | Apple Silicon (`arm64`) | `Sibcut-Video-Editor-macOS-arm64.zip` | Standalone application bundle archive (Apple Silicon) |
            | **macOS** | Intel (`x64`) | **`Sibcut-Video-Editor-macOS-x64.dmg`** | **Recommended macOS download** (Intel Macs) |
            | **macOS** | Intel (`x64`) | `Sibcut-Video-Editor-macOS-x64.zip` | Standalone application bundle archive (Intel) |
            | **Linux** | x64 | **`Sibcut-Video-Editor-Linux-x64.AppImage`** | **Recommended Linux download** (runs directly on all distros) |
            | **Linux** | x64 | `Sibcut-Video-Editor-Linux-x64.deb` | Debian / Ubuntu / Linux Mint package |

            > [!TIP]
            > **macOS Gatekeeper First-Launch Note (Open-Source Build):**  
            > If macOS shows *"Sibcut Video Editor is damaged and can't be opened"*, this is Apple's Gatekeeper quarantine on downloaded internet files. Clear the quarantine attribute by opening **Terminal** and running:
            > ```bash
            > xattr -cr "/Applications/Sibcut Video Editor.app"
            > ```

            ### Verification
            Every download can be verified using the accompanying `SHA256SUMS.txt` file.

            ```bash
            sha256sum --check SHA256SUMS.txt
            ```

            ### Attribution
            Based on the open-source **Everything** project by **HeyPuter** (https://github.com/HeyPuter/everything).  
            Created and maintained by **Sina Sinaei** (sina9100t@gmail.com).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
