name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: License & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify open-source licenses
        run: npm run check:licenses

      - name: Verify packaging guardrails
        run: npm run check:packaging

      - name: Build web assets
        run: npm run build

  build-electron-check:
    name: Electron Build Test (${{ matrix.os }})
    needs: lint-and-validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxext-dev xvfb

      - name: Install dependencies
        run: npm ci

      - name: Compile worker and frontend
        run: npm run build:electron

      - name: Execute Electron Smoke Test (Linux xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx electron . --smoke-test --no-sandbox

      - name: Execute Electron Smoke Test (macOS / Windows)
        if: runner.os != 'Linux'
        run: npx electron . --smoke-test --no-sandbox
